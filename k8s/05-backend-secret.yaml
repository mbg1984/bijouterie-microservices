# =============================================================================
# Secret « backend-secret » : identifiants MySQL utilisés par le backend
# -----------------------------------------------------------------------------
# Les valeurs DOIVENT être identiques à MYSQL_USER / MYSQL_PASSWORD de
# mysql-secret, sinon MySQL répond « Access denied » au backend.
# Injecté clé par clé dans le Deployment backend (env[].valueFrom.secretKeyRef).
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: bijouterie
  labels:
    app: bijouterie
    tier: backend
type: Opaque
data:
  DB_USER: YW1pbmE=                         # "amina"
  DB_PASSWORD: QW1pbmEtQmlqb3V4LTIwMjY=     # même valeur que MYSQL_PASSWORD
