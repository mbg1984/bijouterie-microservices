# =============================================================================
# Secret « mysql-secret » : identifiants de la base MySQL
# -----------------------------------------------------------------------------
# Lu par le conteneur MySQL (via envFrom) : au PREMIER démarrage, l'image
# officielle crée la base MYSQL_DATABASE et l'utilisateur MYSQL_USER.
#
# Les valeurs de « data » sont encodées en base64 (echo -n 'valeur' | base64).
# ATTENTION : base64 n'est PAS un chiffrement, n'importe qui peut décoder.
# Committer ce fichier est toléré pour le TP (Argo CD doit pouvoir le lire),
# mais en production on utiliserait Sealed Secrets, SOPS ou External Secrets.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
  namespace: bijouterie
  labels:
    app: bijouterie
    tier: database
type: Opaque                       # Secret générique (paires clé / valeur)
data:
  MYSQL_ROOT_PASSWORD: Um9vdC1BbWluYS0yMDI2   # mot de passe du compte root
  MYSQL_DATABASE: Ymlqb3V0ZXJpZQ==            # "bijouterie"
  MYSQL_USER: YW1pbmE=                        # "amina" (= DB_USER du backend)
  MYSQL_PASSWORD: QW1pbmEtQmlqb3V4LTIwMjY=    # (= DB_PASSWORD du backend)
